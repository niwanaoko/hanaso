<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>家族の会話モニター</title>
    <style>
        body {
            background-color: #2b2c2f;
            color: #f0f0f0;
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            transition: background-color 0.3s;
            overflow: hidden;
        }
        body.on-mode { background-color: #1a2a3a; }

        #main-area {
            flex: 1; display: flex; align-items: flex-start;
            justify-content: center; padding-top: 10vh;
        }

        #result-text {
            font-size: 4.5vw; font-weight: bold; text-align: left;
            line-height: 1.7; width: 85%; height: 8.5em;
            word-break: break-all; overflow: hidden;
        }

        #status {
            position: fixed; top: 20px; right: 20px; font-size: 1.5rem;
            padding: 15px 30px; border-radius: 12px; font-weight: bold;
        }
        .listening { background-color: #ff4757; color: #fff; box-shadow: 0 0 20px rgba(255,71,87,0.5); }
        .waiting { background-color: #57606f; color: #ced6e0; }
    </style>
</head>
<body id="bg">

    <div id="status" class="waiting">お休み中</div>
    <div id="main-area"><div id="result-text"></div></div>

    <script src="dictionary.js"></script>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        const resultDisplay = document.getElementById('result-text');
        const statusDisplay = document.getElementById('status');
        const bg = document.getElementById('bg');

        let isListening = false;
        let restartTimer = null;

        // 音声認識インスタンスの初期化
        function createRecognition() {
            if (recognition) {
                try { recognition.abort(); } catch(e) {}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onstart = () => {
                statusDisplay.innerText = "文字を出しています";
                statusDisplay.className = "listening";
                bg.className = "on-mode";
            };

            // 自動停止（無言切断・タイムアウト等）が起きた時の処理
            recognition.onend = () => {
                if (isListening) {
                    // ユーザーがオフにしていないのに止まった場合、すぐに再スタート
                    clearTimeout(restartTimer);
                    restartTimer = setTimeout(() => {
                        startRecognition();
                    }, 300); // 0.3秒後に自動再起動
                } else {
                    statusDisplay.innerText = "お休み中";
                    statusDisplay.className = "waiting";
                    bg.className = "";
                }
            };

            // エラー時も諦めずに再起動させる
            recognition.onerror = (event) => {
                console.warn("Speech recognition error:", event.error);
                if (isListening && event.error !== 'aborted') {
                    clearTimeout(restartTimer);
                    restartTimer = setTimeout(() => {
                        startRecognition();
                    }, 500);
                }
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript = event.results[i][0].transcript;
                }

                // 辞書による置換
                if (typeof customDictionary !== 'undefined') {
                    Object.keys(customDictionary).forEach(key => {
                        transcript = transcript.replace(new RegExp(key, 'g'), customDictionary[key]);
                    });
                }

                resultDisplay.innerText = transcript;

                // 枠からあふれた場合、クリアして認識をリセット
                if (resultDisplay.scrollHeight > resultDisplay.clientHeight) {
                    resultDisplay.innerText = "";
                    startRecognition(); // テキストを消して仕切り直し
                }
            };
        }

        // 安全にスタートさせる関数
        function startRecognition() {
            try {
                createRecognition();
                recognition.start();
            } catch(e) {
                // すでに動いている等の例外が発生した場合は破棄して再作成
                setTimeout(() => {
                    createRecognition();
                    try { recognition.start(); } catch(err) {}
                }, 400);
            }
        }

        // ON/OFF切り替え
        const toggle = () => {
            if (isListening) { 
                isListening = false;
                clearTimeout(restartTimer);
                if (recognition) recognition.stop(); 
            } else { 
                isListening = true; 
                resultDisplay.innerText = "";
                startRecognition(); 
            }
        };

        // マウス・キーボード操作
        window.onmousedown = (e) => { e.preventDefault(); toggle(); };
        window.oncontextmenu = (e) => { e.preventDefault(); };
        window.onkeydown = (e) => { if(['Space', 'Enter', 'PageUp', 'PageDown'].includes(e.code)) toggle(); };
    </script>
</body>
</html>
